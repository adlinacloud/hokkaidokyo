<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Travel Journal</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#21312e;background:#f6f8f5}body{margin:0}header{background:linear-gradient(120deg,#194b43,#4c8679);color:white;padding:48px 7%}h1{font-size:clamp(2rem,5vw,4rem);margin:.3em 0}main{max-width:1100px;margin:auto;padding:25px}section{background:white;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 3px 15px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.item{border:1px solid #dce7e2;border-radius:12px;padding:14px}button,a.button{background:#1e6659;color:white;border:0;border-radius:9px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block}input,select{padding:10px;border:1px solid #cddbd4;border-radius:8px;max-width:100%}.muted{color:#60736b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:block;margin:8px 0}#days button{margin:4px}#days button.active{background:#edaa5b;color:#202b27}</style></head><body><header><p>✈ YOUR TRAVEL COMPANION</p><h1 id="title"></h1><p id="subtitle"></p><strong id="countdown"></strong></header><main><section><h2>🗓 Daily itinerary</h2><div id="days"></div><div id="activities" class="grid"></div></section><section><h2>💰 Budget planner</h2><p class="muted">Change the exchange rate or add expenses. Expenses are saved in this browser only.</p><div class="row"><label>JPY per MYR <input id="rate" type="number" min="0.01" step="0.01" value="35"></label><label>Expense (JPY) <input id="amount" type="number" min="0" placeholder="e.g. 1500"></label><label>Category <input id="category" placeholder="Food / transport"></label><button id="add">Add expense</button></div><p id="total"></p><div id="expenses"></div></section><section><h2>🧳 Packing checklist</h2><div id="packing"></div></section><section><h2>🏨 Stay & transport</h2><div id="bookings" class="grid"></div></section><p class="muted">Starter website · Edit trip-data.json to customize · No account required</p></main><script>
let trip;let selected=0;const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const localKey=s=>'trip-'+(trip?.id||'default')+'-'+s;const read=(k,fallback)=>{try{return JSON.parse(localStorage.getItem(localKey(k)))??fallback}catch{return fallback}};const save=(k,v)=>localStorage.setItem(localKey(k),JSON.stringify(v));function renderDays(){ $('days').innerHTML=trip.days.map((d,i)=>`<button class="${i===selected?'active':''}" data-day="${i}">${safe(d.label)}</button>`).join('');$('activities').innerHTML=(trip.days[selected]?.activities||[]).map(a=>`<div class="item"><strong>${safe(a.time)} · ${safe(a.name)}</strong><p>${safe(a.notes)}</p>${a.mapUrl&&/^https:\/\/(www\.)?google\.(com|co\.[a-z]+)\/maps\//.test(a.mapUrl)?`<a class="button" target="_blank" rel="noopener noreferrer" href="${safe(a.mapUrl)}">Open map ↗</a>`:''}</div>`).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.day);renderDays()})}function renderBudget(){const list=read('expenses',[]);const rate=Number($('rate').value)||35;const total=list.reduce((n,e)=>n+e.amount,0);$('total').textContent=`Total: ¥${total.toLocaleString()} ≈ RM ${(total/rate).toFixed(2)}`;$('expenses').innerHTML=list.map((e,i)=>`<div class="row item"><span>${safe(e.category)}: ¥${e.amount.toLocaleString()}</span><button data-remove="${i}">Remove</button></div>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{list.splice(Number(b.dataset.remove),1);save('expenses',list);renderBudget()})}function renderPacking(){const checked=read('packing',{});$('packing').innerHTML=trip.packing.map((p,i)=>`<label><input type="checkbox" data-pack="${i}" ${checked[i]?'checked':''}> ${safe(p)}</label>`).join('');document.querySelectorAll('[data-pack]').forEach(c=>c.onchange=()=>{checked[c.dataset.pack]=c.checked;save('packing',checked)})}async function init(){try{const res=await fetch('./trip-data.json');if(!res.ok)throw Error('Missing trip-data.json');trip=await res.json();$('title').textContent=trip.title;$('subtitle').textContent=trip.subtitle;const days=Math.ceil((new Date(trip.departureDate+'T00:00:00')-new Date())/86400000);$('countdown').textContent=days>0?`${days} days until departure`:days===0?'Departure day!':'Your trip has begun or passed';$('bookings').innerHTML=trip.bookings.map(b=>`<div class="item"><strong>${safe(b.label)}</strong><p>${safe(b.details)}</p></div>`).join('');$('rate').value=read('rate',trip.jpyPerMyr||35);$('rate').oninput=()=>{save('rate',Number($('rate').value));renderBudget()};$('add').onclick=()=>{const amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<=0)return alert('Enter an amount greater than zero');const list=read('expenses',[]);list.push({amount,category:$('category').value||'Other'});save('expenses',list);$('amount').value='';renderBudget()};renderDays();renderBudget();renderPacking()}catch(e){$('title').textContent='Unable to load trip data';$('subtitle').textContent=e.message+' — publish both files together using a local web server or Netlify.'}}init();</script></body></html>
